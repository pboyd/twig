name: Build server image
description: Compute CLI_VERSION and build (optionally push) the server Docker image with shared cache settings.
inputs:
  push:
    description: Whether to push the built image
    required: false
    default: "false"
  tags:
    description: Tags to apply to the built image (docker/build-push-action tags input)
    required: false
    default: ""
  labels:
    description: Labels to apply to the built image (docker/build-push-action labels input)
    required: false
    default: ""
outputs:
  cli_version:
    description: The computed CLI_VERSION build-arg value
    value: ${{ steps.version.outputs.value }}
runs:
  using: composite
  steps:
    - name: Compute CLI_VERSION
      id: version
      shell: bash
      run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: services/twig/Dockerfile
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: |
          CLI_VERSION=${{ steps.version.outputs.value }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
