name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  GO_VERSION: "1.26.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/twig-server

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  server-image:
    name: Build and publish server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: ./.github/actions/build-server-image
        with:
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cli-release:
    name: Build CLI and attach to release
    runs-on: ubuntu-latest
    needs: server-image
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build CLI (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: GOWORK=off go build -o twig ./cmd/twig

      - name: Publish release with CLI asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./twig
          fail_on_unmatched_files: true
