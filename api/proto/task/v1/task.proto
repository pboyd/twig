// API contract for the Task CRUD feature (spec 001-task-crud-api).
//
// This file is the source of truth for the TaskService API. During
// implementation it is copied to services/todo/proto/task/v1/task.proto
// and code is generated from it by `buf generate`.

syntax = "proto3";

package task.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/pboyd/twig/api/gen/task/v1;taskv1";

// TaskService provides CRUD operations over tasks.
service TaskService {
  // CreateTask stores a new task and returns it with its assigned id.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  // ReorderTask repositions a task within its current sibling group by placing it
  // immediately before or after a sibling anchor. It never changes the task's
  // parent. The whole sibling group is renumbered to a contiguous order.
  rpc ReorderTask(ReorderTaskRequest) returns (ReorderTaskResponse);

  // GetTask returns a single task by id.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // ListTasks returns every stored task, ordered by id ascending.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // UpdateTask replaces the editable fields of an existing task
  // (full-replace semantics: omitted optional fields are cleared).
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);

  // DeleteTask removes a task and, by cascade, all of its descendants.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);

  // CompleteTask marks the identified task complete and records the completion
  // moment. It is idempotent: re-completing a task is a successful no-op that
  // returns the row unchanged with its original completed_at.
  //
  // Errors:
  //   NotFound          — no task exists with the given id (for this user)
  //   FailedPrecondition — the task has at least one incomplete descendant
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);

  // UncompleteTask clears completed_at, marking the task incomplete again.
  // Idempotent on already-incomplete tasks.
  //
  // Errors:
  //   NotFound           — no task with the given id for this user
  //   FailedPrecondition — the task's parent is complete
  rpc UncompleteTask(UncompleteTaskRequest) returns (UncompleteTaskResponse);

  // SetEstimate overwrites a task's estimate.
  rpc SetEstimate(SetEstimateRequest) returns (SetEstimateResponse);

  // StartPomodoro creates a new active pomodoro for the calling user
  // against the named task.
  rpc StartPomodoro(StartPomodoroRequest) returns (StartPomodoroResponse);

  // CancelPomodoro cancels the calling user's active pomodoro.
  rpc CancelPomodoro(CancelPomodoroRequest) returns (CancelPomodoroResponse);

  // CompletePomodoro marks the calling user's active pomodoro complete.
  rpc CompletePomodoro(CompletePomodoroRequest) returns (CompletePomodoroResponse);

  // GetActivePomodoro returns the calling user's active pomodoro, if any.
  rpc GetActivePomodoro(GetActivePomodoroRequest) returns (GetActivePomodoroResponse);

  // CountCompletedPomodoros returns how many of the calling user's pomodoros
  // were completed within the half-open UTC instant range [start, end).
  // A pomodoro counts when complete = true and start <= end_at < end,
  // regardless of whether its task is complete.
  rpc CountCompletedPomodoros(CountCompletedPomodorosRequest)
      returns (CountCompletedPomodorosResponse);

  // SetTaskGoal associates a task (and implicitly its whole subtree) with a
  // goal, or clears the association when goal_id is unset.
  //
  // Errors:
  //   NotFound           — task or goal missing (for this user)
  //   FailedPrecondition — an ancestor of the task already has a goal, or
  //                        (when setting) a descendant has its own goal
  rpc SetTaskGoal(SetTaskGoalRequest) returns (SetTaskGoalResponse);

  // FilterTasks evaluates a filter expression (see the filter grammar
  // contract) against the calling user's tasks and returns the ids of the
  // tasks that match. It never returns ancestor-context rows — deciding how
  // to display matches is the client's job.
  //
  // Errors:
  //   InvalidArgument — the expression does not parse or fails validation
  //                     (unknown field, bad operator, malformed date, ...).
  //                     The message is human-readable and safe to display.
  rpc FilterTasks(FilterTasksRequest) returns (FilterTasksResponse);
}

// Task is a single unit of work. Tasks form a hierarchy of unrestricted
// depth via the optional parent_id; no task may appear in its own ancestry.
message Task {
  // Server-assigned, positive, increasing, never reused.
  int64 id = 1;
  // Required, non-empty (trimmed), at most 255 characters.
  string name = 2;
  // Optional longer text; empty string when absent.
  string description = 3;
  // Optional due timestamp (UTC); unset when absent.
  google.protobuf.Timestamp due = 4;
  // Optional parent task id; unset for a top-level task.
  optional int64 parent_id = 5;
  // Unset when the task is incomplete; set to the moment of completion
  // (UTC) when complete. Once set, it never changes.
  google.protobuf.Timestamp completed_at = 6;
  // User's estimated number of pomodoros to complete this task.
  // 0 means "no estimate" (default). Server enforces 0 <= estimate <= 10.
  int32 estimate = 7;
  // Number of completed pomodoros for this task by the calling user.
  // Read-only; computed server-side. 0 when none. Ignored on writes.
  int32 completed_pomodoro_count = 8;
  // Order of this task within its sibling group (tasks sharing the same
  // parent_id, or the root group for parentless tasks). Lower sorts first.
  // Read-only: populated on reads, ignored on CreateTask/UpdateTask writes.
  int64 position = 9;
  // Optional day before which this task is hidden from default ("pending")
  // views. Pinned to midnight UTC of the chosen calendar day. Unset when the
  // task is not snoozed. Clients hide the task while this day is strictly after
  // the client's local current day; on/after that day the task is shown.
  google.protobuf.Timestamp snooze_until = 10;
  // Effective only on the association root: the goal this task's subtree
  // belongs to. Unset when the task is not directly associated with a goal
  // (descendants inherit the nearest ancestor's goal client-side).
  // Read-only: populated on reads, ignored on CreateTask/UpdateTask writes.
  // UpdateTask writes goal_id as part of a move: descent clears it on the
  // moved task and every descendant; promotion writes the goal inherited
  // from the nearest goal-bearing ancestor (the write always uses an
  // internal direct UPDATE rather than SetTaskGoal, which is why a
  // promotion may link a task to a completed or archived goal that
  // SetTaskGoal would refuse). See specs/072-move-task-goal-rules/contracts.
  optional int64 goal_id = 11;
}

message Pomodoro {
  int64 id = 1;
  int64 task_id = 2;
  google.protobuf.Timestamp start_at = 3;
  google.protobuf.Timestamp end_at = 4;
  bool complete = 5;
}

message CompleteTaskRequest {
  // Identifier of the task to mark complete.
  int64 id = 1;
}

message CompleteTaskResponse {
  // The task in its post-completion state. For a task that was already
  // complete, this is the unchanged row.
  Task task = 1;
}

message UncompleteTaskRequest {
  int64 id = 1;
}

message UncompleteTaskResponse {
  Task task = 1;
}

message CreateTaskRequest {
  string name = 1;
  string description = 2;
  google.protobuf.Timestamp due = 3;
  optional int64 parent_id = 4;
  // Optional snooze day (midnight UTC). Unset = not snoozed.
  google.protobuf.Timestamp snooze_until = 5;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  int64 id = 1;
}

message GetTaskResponse {
  Task task = 1;
  int64 completed_pomodoro_count = 2;
  repeated Pomodoro pomodoros = 3;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message UpdateTaskRequest {
  // Identifies the task to update.
  int64 id = 1;
  // Full-replace: these become the task's new editable state.
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp due = 4;
  // Unset clears the parent, making the task top-level.
  optional int64 parent_id = 5;
  // Full-replace: present sets/overwrites; absent clears (un-snoozes the task).
  google.protobuf.Timestamp snooze_until = 6;
}

message UpdateTaskResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  int64 id = 1;
}

message DeleteTaskResponse {}

message SetEstimateRequest {
  int64 task_id = 1;
  int32 estimate = 2;
}
message SetEstimateResponse {
  Task task = 1;
}

message StartPomodoroRequest {
  int64 task_id = 1;
}
message StartPomodoroResponse {
  Pomodoro pomodoro = 1;
}

message CancelPomodoroRequest {}
message CancelPomodoroResponse {
  Pomodoro pomodoro = 1;
}

message CompletePomodoroRequest {}
message CompletePomodoroResponse {
  Pomodoro pomodoro = 1;
}

message GetActivePomodoroRequest {}
message GetActivePomodoroResponse {
  Pomodoro pomodoro = 1;
}

message CountCompletedPomodorosRequest {
  // Inclusive lower bound (UTC). Required.
  google.protobuf.Timestamp start = 1;
  // Exclusive upper bound (UTC). Required; must be after start.
  google.protobuf.Timestamp end = 2;
}

message CountCompletedPomodorosResponse {
  // Number of pomodoros completed in [start, end). 0 when none.
  int64 count = 1;
}

message ReorderTaskRequest {
  // The task to move.
  int64 task_id = 1;

  // Where to place it, relative to a sibling anchor. Exactly one must be set.
  oneof anchor {
    // Place task_id immediately before this sibling.
    int64 before_task_id = 2;
    // Place task_id immediately after this sibling.
    int64 after_task_id = 3;
  }
}

message ReorderTaskResponse {
  // The moved task's sibling group (including the moved task), in the new
  // order, each with its updated position.
  repeated Task siblings = 1;
}

message SetTaskGoalRequest {
  int64 task_id = 1;
  // Present: associate with this goal. Absent: clear the association.
  optional int64 goal_id = 2;
}
message SetTaskGoalResponse { Task task = 1; }

message FilterTasksRequest {
  // The filter expression. Must be non-empty; clients treat an empty input
  // as "no filter" and simply don't call FilterTasks.
  string expression = 1;

  // The client's "show all" state. When false and the expression contains
  // no completed (resp. snoozed) condition, an implicit completed=false
  // (resp. snoozed=false) condition is applied. Explicit conditions in the
  // expression replace only their own attribute's implicit default.
  bool show_all = 2;

  // The client's current local calendar day, formatted YYYY-MM-DD.
  // Required. Used to evaluate snoozed: a task is snoozed when its
  // snooze_until day is strictly after this day (same rule clients already
  // use for default views).
  string today = 3;
}

message FilterTasksResponse {
  // Ids of the calling user's tasks that satisfy the expression, ascending.
  // Empty when nothing matches (including when an id in the expression
  // references a task or goal that doesn't exist — that is not an error).
  repeated int64 task_ids = 1;
}
