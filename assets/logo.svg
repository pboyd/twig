<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="twig logo">
  <defs>
    <linearGradient id="stem" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Side shoot off the stem (drawn first so the stem covers the joint) -->
  <path d="M68 66 Q80 50 92 46"
        fill="none" stroke="#22c55e" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Checkmark that grows into the twig stem -->
  <path d="M24 70 L46 94 L96 30"
        fill="none" stroke="url(#stem)" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leaf at the tip of the stem -->
  <path d="M96 30 Q94 8 116 4 Q120 26 100 33 Z" fill="url(#leaf)"/>

  <!-- Leaf on the side shoot -->
  <path d="M92 46 Q98 30 116 32 Q114 50 95 51 Z" fill="url(#leaf)"/>

  <!-- Leaf budding low on the stem -->
  <path d="M60 76 Q72 72 80 80 Q70 90 59 82 Z" fill="url(#leaf)"/>
</svg>
